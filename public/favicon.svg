<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="0.6"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- soft ambient glow behind cloud -->
  <circle cx="32" cy="32" r="20" fill="url(#g1)" opacity="0.4" filter="url(#blur1)"/>
  <circle cx="34" cy="30" r="14" fill="url(#g2)" opacity="0.3" filter="url(#blur1)"/>

  <!-- outer dim particles -->
  <circle cx="14" cy="28" r="1.4" fill="#a78bfa" opacity="0.4"/>
  <circle cx="18" cy="18" r="1.0" fill="#60a5fa" opacity="0.35"/>
  <circle cx="22" cy="12" r="1.2" fill="#c084fc" opacity="0.45"/>
  <circle cx="50" cy="22" r="1.1" fill="#818cf8" opacity="0.4"/>
  <circle cx="48" cy="38" r="1.3" fill="#a78bfa" opacity="0.38"/>
  <circle cx="44" cy="48" r="1.0" fill="#60a5fa" opacity="0.35"/>
  <circle cx="20" cy="46" r="1.2" fill="#c084fc" opacity="0.4"/>
  <circle cx="12" cy="38" r="0.9" fill="#818cf8" opacity="0.3"/>
  <circle cx="52" cy="30" r="1.0" fill="#e879f9" opacity="0.35"/>
  <circle cx="30" cy="8"  r="1.1" fill="#60a5fa" opacity="0.4"/>
  <circle cx="40" cy="10" r="0.9" fill="#c084fc" opacity="0.35"/>
  <circle cx="16" cy="52" r="0.8" fill="#818cf8" opacity="0.3"/>

  <!-- mid particles -->
  <circle cx="22" cy="36" r="2.0" fill="#c084fc" opacity="0.6"/>
  <circle cx="28" cy="20" r="1.8" fill="#60a5fa" opacity="0.6"/>
  <circle cx="36" cy="16" r="1.6" fill="#a78bfa" opacity="0.55"/>
  <circle cx="44" cy="28" r="1.8" fill="#818cf8" opacity="0.6"/>
  <circle cx="42" cy="40" r="1.6" fill="#c084fc" opacity="0.55"/>
  <circle cx="26" cy="48" r="1.7" fill="#60a5fa" opacity="0.55"/>
  <circle cx="18" cy="32" r="1.5" fill="#e879f9" opacity="0.5"/>
  <circle cx="38" cy="50" r="1.4" fill="#a78bfa" opacity="0.5"/>
  <circle cx="46" cy="18" r="1.5" fill="#60a5fa" opacity="0.5"/>

  <!-- core bright particles -->
  <circle cx="28" cy="34" r="2.8" fill="#e879f9" opacity="0.9" filter="url(#glow)"/>
  <circle cx="36" cy="28" r="2.4" fill="#a855f7" opacity="0.95" filter="url(#glow)"/>
  <circle cx="32" cy="40" r="2.2" fill="#38bdf8" opacity="0.85" filter="url(#glow)"/>
  <circle cx="40" cy="36" r="2.0" fill="#c084fc" opacity="0.9" filter="url(#glow)"/>
  <circle cx="24" cy="26" r="2.0" fill="#818cf8" opacity="0.85" filter="url(#glow)"/>
  <circle cx="34" cy="22" r="1.8" fill="#e879f9" opacity="0.8" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3.2" fill="#c084fc" opacity="0.95" filter="url(#glow)"/>
</svg>

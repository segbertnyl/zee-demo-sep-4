name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the Node version Vercel builds with, so a green CI means a green deploy.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
